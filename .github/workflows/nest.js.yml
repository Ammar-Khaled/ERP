name: Nest.js CI

on:
  push:
    branches: [ "main" ]


jobs:
  run-dev:

    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js v22.15.0
      uses: actions/setup-node@v4
      with:
        node-version: 22.15.0
        cache: 'npm'
    - run: npm i
    - run: cd backend && npm run start:dev
